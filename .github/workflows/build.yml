name: b
on: push
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: unzip -q p.zip -d p && bash p/go.sh
      - uses: actions/upload-artifact@v4
        with:
          name: shutu-apk
          path: out/app.apk
concurrency: 
